<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="stylesheet" href="./src/level2.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <div class="status">
          <div>
            <p class="label">Score</p>
            <p class="value" id="score">0</p>
          </div>
          <div>
            <p class="label">Best</p>
            <p class="value" id="best-score">0</p>
          </div>
          <div>
            <p class="label">State</p>
            <p class="value" id="state">Running</p>
          </div>
        </div>

        <div class="board-wrap">
          <div
            id="splash-screen"
            class="splash-screen"
            aria-label="Game overlay"
          >
            <div class="splash-content">
              <p id="splash-title" class="splash-title">Level 1</p>
              <button id="start-button" type="button">Start</button>
              <p id="splash-caption" class="splash-caption">Press Space to start</p>
            </div>
          </div>
          <div
            id="board"
            class="board"
            role="grid"
            aria-label="Snake board"
          ></div>
        </div>

        <div class="actions">
          <button id="pause-button" type="button">Pause</button>
          <button id="restart-button" type="button">Restart</button>
          <button id="eat-button" type="button">Eat</button>
          <button id="next-level-button" type="button">Next Level</button>
        </div>

        <div class="controls" aria-label="Directional controls">
          <button class="control control-up" data-direction="up" type="button">Up</button>
          <button class="control control-left" data-direction="left" type="button">Left</button>
          <button class="control control-down" data-direction="down" type="button">Down</button>
          <button class="control control-right" data-direction="right" type="button">Right</button>
        </div>

        <p class="hint">Use arrow keys or WASD. Press space to pause and R to restart.</p>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
